[about]
author=Wissam Jassim (written with Claude)
description=Copies a part of the page (PDF background + pen writing) as a movable picture, with a transparent background if wanted, and puts it on the clipboard too. Click Snapshot in the floating window (or Ctrl+Alt+F8), drag a rectangle: a selected copy sits on top of the original, ready to drag. Ctrl+Alt+F9 shows the window. Needs Xournal++ 1.3.8 or newer.
version=0.10

[default]
enabled=true

[plugin]
mainfile=main.lua
